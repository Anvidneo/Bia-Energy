name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build

  sonarcloud:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history improves SonarCloud's new-code/blame reporting.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Backend tests with coverage
        working-directory: backend
        run: go test ./... -coverprofile=coverage.out

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend install & build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-backend:
    name: Deploy backend (Render)
    needs: [test-backend, test-frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [test-backend, test-frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: team_TZxnknKGtCRPnQKtQuuESXVG
      VERCEL_PROJECT_ID: prj_sMus8aUtiZJU8Kd9odGGBm46YBnW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # amondnet/vercel-action bundles an old Vercel CLI (25.x) that Vercel's
      # API has since stopped accepting ("CLI version is outdated, requires
      # >=47.2.2"). Use the official CLI directly instead, per Vercel's own
      # CI/CD docs: pull the project's settings, build, then deploy the
      # already-built output.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build project artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
