name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Opts the internal/db integration tests in — see db_test.go.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go build ./...
      - run: go test ./...

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run test
      - run: npm run build

  sonarcloud:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history improves SonarCloud's new-code/blame reporting.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Backend tests with coverage
        working-directory: backend
        run: go test ./... -coverprofile=coverage.out

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend install, test & build
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run test:coverage
          npm run build

      # Sonar resolves LCOV "SF:" paths relative to the repo root (where the
      # scanner runs), but vitest writes them relative to frontend/ (its own
      # cwd) — e.g. "src/api.ts" instead of "frontend/src/api.ts". Without
      # this, SonarCloud silently ignores the report and frontend coverage
      # stays at 0%.
      - name: Fix frontend coverage paths for SonarCloud
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # The scan action above never fails just because the Quality Gate
      # didn't pass — it only fails on a scanner/technical error. Without
      # this step, deploy-backend/deploy-frontend would go ahead even with
      # a failing gate, since they only depend on this job succeeding.
      - name: SonarCloud Quality Gate check
        id: quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Fail the job if the Quality Gate didn't pass
        if: steps.quality-gate-check.outputs.quality-gate-status != 'PASSED'
        run: |
          echo "Quality gate status: ${{ steps.quality-gate-check.outputs.quality-gate-status }}"
          exit 1

  deploy-backend:
    name: Deploy backend (Render)
    needs: [test-backend, test-frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-frontend:
    name: Deploy frontend (Vercel)
    needs: [test-backend, test-frontend, sonarcloud]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: team_TZxnknKGtCRPnQKtQuuESXVG
      VERCEL_PROJECT_ID: prj_sMus8aUtiZJU8Kd9odGGBm46YBnW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # amondnet/vercel-action bundles an old Vercel CLI (25.x) that Vercel's
      # API has since stopped accepting ("CLI version is outdated, requires
      # >=47.2.2"). Use the official CLI directly instead, per Vercel's own
      # CI/CD docs: pull the project's settings, build, then deploy the
      # already-built output.
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build project artifacts
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy prebuilt output
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
