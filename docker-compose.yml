services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bia
      POSTGRES_PASSWORD: bia
      POSTGRES_DB: bia_energy
    ports:
      - "5432:5432"
    volumes:
      - bia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bia -d bia_energy"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://bia:bia@postgres:5432/bia_energy?sslmode=disable
      USE_LLM_EXPLAINER: "false"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:8080"

volumes:
  bia_pgdata:
