# SonarCloud project configuration.
#
# Remaining steps to activate real scans:
#   1. In sonarcloud.io (org "anvidneo") click "Analyze new project" and
#      import Anvidneo/Bia-Energy from GitHub. Confirm the projectKey it
#      assigns matches sonar.projectKey below (SonarCloud sometimes uses a
#      different casing/separator than the repo name — update it here if so).
#   2. Add the SONAR_TOKEN repository secret on GitHub (already explained).
#   3. Push — .github/workflows/sonarcloud.yml runs the scan automatically.

sonar.projectKey=Anvidneo_Bia-Energy
sonar.organization=anvidneo

# Go backend + TypeScript/React frontend in one multi-language scan.
sonar.sources=backend,frontend/src
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,backend/data/**,frontend/public/**

sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

# Populated by `go test ./... -coverprofile=coverage.out` in CI (see workflow).
sonar.go.coverage.reportPaths=backend/coverage.out

# Populated by `npm run test:coverage` (vitest) in CI. Paths inside the
# LCOV file are rewritten from frontend/-relative to repo-root-relative
# by the workflow before this runs (see ci-cd.yml).
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
