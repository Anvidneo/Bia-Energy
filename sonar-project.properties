# SonarCloud project configuration.
#
# To activate real scans:
#   1. Sign in at https://sonarcloud.io with your GitHub account (Anvidneo)
#      and import this repository as a new project (free for public repos).
#   2. Replace <your-sonarcloud-org> below with the organization key SonarCloud
#      assigns you (shown on the project's Information page).
#   3. In the GitHub repo settings, add a repository secret named SONAR_TOKEN
#      with a token generated from SonarCloud (My Account > Security).
#   4. Push — .github/workflows/sonarcloud.yml runs the scan automatically.

sonar.projectKey=Anvidneo_Bia-Energy
sonar.organization=<your-sonarcloud-org>

# Go backend + TypeScript/React frontend in one multi-language scan.
sonar.sources=backend,frontend/src
sonar.exclusions=frontend/node_modules/**,frontend/dist/**,backend/data/**,frontend/public/**

sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx

# Populated by `go test ./... -coverprofile=coverage.out` in CI (see workflow).
sonar.go.coverage.reportPaths=backend/coverage.out
